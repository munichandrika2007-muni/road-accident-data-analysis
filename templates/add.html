{% extends "base.html" %}{% block content %}<div class="card panel p-4 mx-auto" style="max-width:760px"><h2 class="h4">Add accident record</h2><form method="post" class="row g-3">
<div class="col-md-6"><label class="form-label">Date and time</label><input class="form-control" type="datetime-local" name="accident_datetime" required></div><div class="col-md-6"><label class="form-label">Region</label><input class="form-control" name="region" required></div>
<div class="col-md-6"><label class="form-label">Road name (optional)</label><input class="form-control" name="road_name"></div><div class="col-md-6"><label class="form-label">Vehicle type</label><select class="form-select" name="vehicle_type" required>{% for v in vehicles %}<option>{{v}}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Severity</label><select class="form-select" name="severity">{% for s in severities %}<option>{{s}}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Weather (optional)</label><input class="form-control" name="weather"></div><div class="col-12"><button class="btn btn-primary">Save record</button></div></form></div>{% endblock %}
